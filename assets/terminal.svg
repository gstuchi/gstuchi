<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Giovani Stuchi, developer and builder</title>
  <desc id="desc">Terminal showing Giovani's profile: CS at Mauá, IT at Full Sail. Shipping custta, PoliGen-AI and Nutri Esportiva. Stack: Swift, JavaScript, TypeScript, Firebase and Claude Code. Website: giovanistuchi.com.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #FAF9F5; }
    .name { font-size: 28px; font-weight: 700; }
    .muted { fill: #B0AEA5; }
    .accent { fill: #D97757; }
    .bar { font-size: 13px; fill: #8A8880; }
    .line { animation: show .01s linear both; }
    .l2 { animation-delay: .25s; }
    .l3 { animation-delay: .5s; }
    .l4 { animation-delay: .75s; }
    .l5 { animation-delay: 1s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
  </style>

  <rect width="720" height="420" rx="14" fill="#141413"/>
  <rect x=".5" y=".5" width="719" height="419" rx="13.5" fill="none" stroke="#3A3935"/>
  <circle cx="26" cy="24" r="6" fill="#D97757"/>
  <circle cx="46" cy="24" r="6" fill="#4A4944"/>
  <circle cx="66" cy="24" r="6" fill="#4A4944"/>
  <text class="bar" x="360" y="29" text-anchor="middle">gstuchi: ~</text>

  <g class="line">
    <text x="28" y="74"><tspan class="accent">&gt;</tspan> whoami</text>
    <text class="name" x="28" y="112">Giovani Stuchi</text>
    <text class="muted" x="28" y="140">Developer &amp; builder. CS @ Mauá, IT @ Full Sail.</text>
  </g>

  <g class="line l2">
    <text x="28" y="186"><tspan class="accent">&gt;</tspan> ls ./shipping</text>
    <text x="28" y="214">custta.</text>
    <text class="muted" x="210" y="214">iOS + PWA, live in production</text>
    <text x="28" y="240">poligen-ai</text>
    <text class="muted" x="210" y="240">Flutter + image generation</text>
    <text x="28" y="266">nutri-esportiva</text>
    <text class="muted" x="210" y="266">product owner, React + Prisma</text>
  </g>

  <g class="line l3">
    <text x="28" y="312"><tspan class="accent">&gt;</tspan> cat stack.txt</text>
    <text class="muted" x="28" y="340">Swift · JavaScript · TypeScript · Firebase · Claude Code</text>
  </g>

  <g class="line l4">
    <text x="28" y="386"><tspan class="accent">&gt;</tspan> open giovanistuchi.com <tspan class="accent cursor">█</tspan></text>
  </g>
</svg>
